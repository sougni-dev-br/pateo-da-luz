services:
  - type: web
    name: pateo-backend
    runtime: node
    rootDir: backend
    # Starter desde 2026-07 (sem sleep, memória 512MB). Não voltar para free —
    # o restaurante opera em produção; free dorme após 15min e mata sessões
    # de longa duração (ex.: WhatsApp/Baileys).
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run prisma:deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        # O banco pateo-postgres foi deletado (08/2026) e restaurado pelo suporte
        # como recurso novo FORA do blueprint (pateo-postgres-copy). Por isso o
        # DATABASE_URL é gerenciado manualmente no dashboard — o blueprint não deve
        # sobrescrevê-lo. NÃO reintroduzir uma seção `databases:` aqui sem migrar
        # o banco restaurado para o blueprint, ou um sync recria um banco vazio.
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://pateo.sougni.com
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.13.1"
