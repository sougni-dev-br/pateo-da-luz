databases:
  - name: pateo-postgres
    # Basic-256mb desde 2026-07 (backup diário + retention 7 dias).
    # NÃO usar 'free' — o Postgres free expira após 90 dias e não tem backup.
    plan: basic_256mb
    databaseName: pateo
    user: pateo

services:
  - type: web
    name: pateo-backend
    runtime: node
    rootDir: backend
    # Starter desde 2026-07 (sem sleep, memória 512MB). Não voltar para free —
    # o restaurante opera em produção; free dorme após 15min e mata sessões
    # de longa duração (ex.: WhatsApp/Baileys).
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run prisma:deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pateo-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://pateo.sougni.com
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.13.1"
